<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="nav">
      <a href="/" class="nav__name" aria-label="Viktor Dopke, home">
        <span>Viktor Dopke</span>
        <span>Product Designer</span>
      </a>
      <div class="nav__end">
      <nav id="nav-links" class="nav__links" aria-label="Main">
        <a href="/work/" data-page="work">Work</a>
        <a href="/about/" data-page="about">About</a>
        <a href="/Viktor-Dopke-Resume.pdf" download="Viktor-Dopke-Resume.pdf" data-external>Resume <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0-4-4m4 4 4-4" /><path d="M4 20h16" /></svg></a>
      </nav>
      <button type="button" class="nav__cta" data-contact>Get in touch</button>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      </div>
    </header>

    <main id="main"></main>

    <dialog id="contact" class="contact" aria-label="Contact Viktor">
      <div class="contact__panel" data-settle>
        <button type="button" class="contact__close" aria-label="Close contact">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
        <p class="contact__label">Get in touch</p>
        <a class="contact__row" href="https://wa.me/5541995006333" target="_blank" rel="noopener noreferrer">
          <svg class="contact__whatsapp" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 004.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 01-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.55-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z" /></svg>
          <span><strong>WhatsApp</strong><small>+55 41 99500-6333</small></span>
        </a>
        <div class="contact__email">
          <a class="contact__row" href="mailto:vikdopke@gmail.com">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" /><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span><strong>Email</strong><small>vikdopke@gmail.com</small></span>
          </a>
          <button type="button" class="contact__copy" aria-label="Copy email address">Copy</button>
        </div>
        <hr />
        <form class="contact__form">
          <label for="contact-message">Send a quick hello</label>
          <textarea id="contact-message" name="message" rows="3" maxlength="1000" required placeholder="Feedback, a question, or just hi"></textarea>
          <label for="contact-email" class="visually-hidden">Your email (optional)</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="Your email (optional, for a reply)" />
          <input name="_gotcha" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" hidden />
          <p class="contact__error" role="alert" hidden></p>
          <div class="contact__foot">
            <span class="contact__count">0/1000</span>
            <button type="submit" class="btn btn--primary btn--small">Send</button>
          </div>
        </form>
        <div class="contact__sent" role="status" hidden>
          <p><strong>Thanks, message received.</strong></p>
          <p>I read every note. If you left an email, I'll get back to you.</p>
          <button type="button" class="text-link contact__again">Send another</button>
        </div>
      </div>
    </dialog>
    <dialog id="lightbox" class="lightbox"><img alt="" /></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
